services:
  - type: web
    name: tg-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PAYMENT_PROVIDER_TOKEN
        sync: false
      - key: SUBSCRIPTION_PRICE
        value: "100"
      - key: SUBSCRIPTION_DAYS
        value: "30"
      - key: WEBHOOK_HOST
        sync: false
      - key: WEBHOOK_PATH
        value: "/webhook"
      - key: WEBAPP_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
